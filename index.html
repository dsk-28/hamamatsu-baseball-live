<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>浜松南 野球速報 実用版</title>
<style>
:root{--blue:#124c87;--light:#eef4fa;--line:#d9e0e8;--green:#16844a;--red:#c63c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f3f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--blue);color:#fff;padding:13px 14px calc(11px + env(safe-area-inset-top));padding-top:calc(13px + env(safe-area-inset-top))}
h1{font-size:19px;margin:0}.small{font-size:12px;color:#697586}.white{color:#dbeafe}
main{max-width:600px;margin:auto;padding:10px 10px 100px}.card{background:#fff;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px #0000000b}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
button{border:0;border-radius:11px;background:#e9eef4;color:#153e66;font-size:16px;font-weight:700;min-height:48px;padding:9px 8px}
button:active{transform:scale(.98);filter:brightness(.96)}button.primary{background:var(--blue);color:#fff}button.green{background:var(--green);color:#fff}button.red{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.inning{font-size:20px;font-weight:800}.score{font-size:34px;font-weight:900}.player{font-size:20px;font-weight:800}
.result.selected{outline:3px solid #1c70b7;background:#e6f2ff}
.hidden{display:none}.log{padding:9px 3px;border-bottom:1px solid #edf0f3;font-size:15px}.log:last-child{border:0}
textarea,input{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
textarea{min-height:190px}.num{font-size:12px;color:#667085}
.tab{display:flex;gap:7px}.tab button{flex:1}.tab .on{background:#153e66;color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:22px;display:none;z-index:30}
hr{border:0;border-top:1px solid #edf0f3;margin:12px 0}
</style>
</head>
<body>
<header>
  <h1>⚾ 浜松南 野球速報</h1>
  <div class="white" id="status">入力内容はこのiPhoneに自動保存</div>
</header>
<main>

<section class="card">
 <div class="row between">
  <div><div class="small">現在の攻撃</div><div class="inning" id="inningLabel">1回表</div></div>
  <div style="text-align:right"><div class="small">浜松南</div><div class="score" id="score">0</div></div>
 </div>
 <div class="tab" style="margin-top:10px">
  <button id="prevInn">‹ 前</button><button class="on" id="nowInn">1回表</button><button id="nextInn">次 ›</button>
 </div>
</section>

<section class="card">
 <div class="row between">
   <div><div class="small">現在の打者</div><div class="player" id="batter">1番　選手名未登録</div></div>
   <div class="num" id="plate">打席 1</div>
 </div>
 <div style="height:9px"></div>
 <div class="grid" id="resultGrid"></div>
</section>

<section class="card hidden" id="positionCard">
 <div class="player">相手の守備位置</div>
 <div class="small" style="margin:3px 0 9px">必要なプレーだけ選択してください</div>
 <div class="grid" id="positionGrid"></div>
 <button style="width:100%;margin-top:8px" id="noPosition">守備位置なしで確定</button>
</section>

<section class="card">
 <div class="grid2">
  <button class="primary" id="confirm">この打席を確定</button>
  <button id="nextBatter">次の打者</button>
 </div>
 <div style="height:7px"></div>
 <div class="grid2">
  <button id="subBtn">選手交代</button>
  <button id="undoBtn">↩ 1つ戻す</button>
 </div>
</section>

<section class="card">
 <div class="row between"><div class="player">このイニング</div><button id="clearInn">イニング取消</button></div>
 <div id="logs" style="margin-top:7px"></div>
</section>

<section class="card">
 <div class="row between"><div class="player">速報</div><button class="green" id="makePost">速報を作成</button></div>
 <div id="postArea" class="hidden" style="margin-top:9px">
  <textarea id="postText"></textarea>
  <div class="grid2" style="margin-top:8px"><button id="copy">コピー</button><button class="green" id="share">共有</button></div>
 </div>
</section>

<section class="card">
 <div class="row between"><div class="player">メンバー</div><button id="editMembers">編集</button></div>
 <div id="memberEditor" class="hidden" style="margin-top:9px"></div>
</section>

<section class="card hidden" id="subCard">
 <div class="player">選手交代</div>
 <div class="small" style="margin:4px 0 8px">交代前 → 交代後</div>
 <div class="grid2"><input id="subOut" placeholder="交代する選手"><input id="subIn" placeholder="入る選手"></div>
 <div style="height:8px"></div><button class="green" style="width:100%" id="saveSub">交代を記録</button>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
const KEY="hamamatsu_live_v2";
const results=["ヒット","2塁打","3塁打","本塁打","四球","死球","犠打","犠飛","三振","ゴロ","フライ","エラー","その他"];
const positions=["投手","捕手","一塁","二塁","三塁","遊撃","左翼","中堅","右翼"];
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 inning:1, half:"表", score:0, batter:0,
 members:["選手名未登録","選手名未登録","選手名未登録","選手名未登録","選手名未登録","選手名未登録","選手名未登録","選手名未登録","選手名未登録"],
 plays:[], pending:null
};
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",1500)}
function render(){
 document.getElementById("inningLabel").textContent=state.inning+"回"+state.half;
 document.getElementById("nowInn").textContent=state.inning+"回"+state.half;
 document.getElementById("score").textContent=state.score;
 let n=state.members[state.batter]||"選手名未登録";
 document.getElementById("batter").textContent=(state.batter+1)+"番　"+n;
 let count=state.plays.filter(p=>p.inning===state.inning&&p.half===state.half&&p.type==="打席").length+1;
 document.getElementById("plate").textContent="打席 "+count;
 renderLogs(); save();
}
function renderLogs(){
 let a=state.plays.filter(p=>p.inning===state.inning&&p.half===state.half);
 document.getElementById("logs").innerHTML=a.length?a.map((p,i)=>`<div class="log">${p.type==="交代"?"選手交代："+p.out+" → "+p.in:p.name+"：<b>"+p.result+"</b>"+(p.pos?"（"+p.pos+"）":"")}</div>`).join(""):"<div class='small'>まだ入力されていません</div>";
}
function chooseResult(r){
 state.pending={result:r,pos:""};
 document.querySelectorAll(".result").forEach(x=>x.classList.toggle("selected",x.textContent===r));
 if(["ヒット","2塁打","3塁打","本塁打","犠打","犠飛","ゴロ","フライ"].includes(r)){
  document.getElementById("positionCard").classList.remove("hidden");toast("守備位置を選択してください");
 } else finishPending();
}
function finishPending(){
 if(!state.pending)return;
 let n=state.members[state.batter]||"選手名未登録";
 state.plays.push({type:"打席",inning:state.inning,half:state.half,name:n,result:state.pending.result,pos:state.pending.pos});
 if(state.pending.result==="本塁打")state.score++;
 state.pending=null;document.getElementById("positionCard").classList.add("hidden");
 document.querySelectorAll(".result").forEach(x=>x.classList.remove("selected"));save();render();toast("打席を記録しました");
}
document.getElementById("resultGrid").innerHTML=results.map(r=>`<button class="result">${r}</button>`).join("");
document.querySelectorAll(".result").forEach(b=>b.onclick=()=>chooseResult(b.textContent));
document.getElementById("positionGrid").innerHTML=positions.map(p=>`<button>${p}</button>`).join("");
document.querySelectorAll("#positionGrid button").forEach(b=>b.onclick=()=>{if(state.pending){state.pending.pos=b.textContent;finishPending()}});
document.getElementById("noPosition").onclick=finishPending;
document.getElementById("confirm").onclick=()=>state.pending?finishPending():toast("結果を選択してください");
document.getElementById("nextBatter").onclick=()=>{state.batter=(state.batter+1)%state.members.length;render();toast("次の打者")};
function changeHalf(delta){
 if(delta>0){if(state.half==="表")state.half="裏";else{state.half="表";state.inning++}}
 else {if(state.half==="裏")state.half="表";else if(state.inning>1){state.inning--;state.half="裏"}}
 state.batter=0;state.pending=null;document.getElementById("positionCard").classList.add("hidden");render();toast(state.inning+"回"+state.half);
}
document.getElementById("nextInn").onclick=()=>changeHalf(1);document.getElementById("prevInn").onclick=()=>changeHalf(-1);
document.getElementById("undoBtn").onclick=()=>{if(!state.plays.length){toast("戻せる入力がありません");return}let p=state.plays.pop();if(p.result==="本塁打")state.score--;render();toast("直前の入力を取り消しました")};
document.getElementById("clearInn").onclick=()=>{state.plays=state.plays.filter(p=>!(p.inning===state.inning&&p.half===state.half));render();toast("このイニングを取消しました")};
document.getElementById("subBtn").onclick=()=>document.getElementById("subCard").classList.toggle("hidden");
document.getElementById("saveSub").onclick=()=>{let o=document.getElementById("subOut").value.trim(),i=document.getElementById("subIn").value.trim();if(!o||!i){toast("交代前・交代後を入力してください");return}state.plays.push({type:"交代",inning:state.inning,half:state.half,out:o,in:i});document.getElementById("subOut").value="";document.getElementById("subIn").value="";render();toast("選手交代を記録しました")};
document.getElementById("makePost").onclick=()=>{
 let a=state.plays.filter(p=>p.inning===state.inning&&p.half===state.half);
 let lines=a.map(p=>p.type==="交代"?`選手交代：${p.out} → ${p.in}`:`${p.name}：${p.result}${p.pos?"（"+p.pos+"）":""}`);
 document.getElementById("postText").value=`【${state.inning}回${state.half}】\n${lines.join("\n")}\n\n浜松南 ${state.score}`;
 document.getElementById("postArea").classList.remove("hidden");
};
document.getElementById("copy").onclick=async()=>{let t=document.getElementById("postText").value;try{await navigator.clipboard.writeText(t)}catch(e){document.getElementById("postText").select();document.execCommand("copy")}toast("速報をコピーしました")};
document.getElementById("share").onclick=async()=>{let t=document.getElementById("postText").value;if(navigator.share){try{await navigator.share({text:t})}catch(e){}}else document.getElementById("copy").click()};
document.getElementById("editMembers").onclick=()=>{
 let e=document.getElementById("memberEditor");e.classList.toggle("hidden");
 e.innerHTML=state.members.map((n,i)=>`<div class="row" style="margin-bottom:7px"><b style="width:38px">${i+1}番</b><input data-i="${i}" value="${n}" placeholder="選手名"></div>`).join("")+`<button class="green" style="width:100%" id="saveMembers">選手名を保存</button>`;
 document.getElementById("saveMembers").onclick=()=>{document.querySelectorAll("#memberEditor input").forEach(x=>state.members[+x.dataset.i]=x.value.trim()||"選手名未登録");save();render();toast("メンバーを保存しました")};
};
render();
</script>
</body>
</html>
