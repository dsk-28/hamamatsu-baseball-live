<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>浜松南 野球速報 実用版</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--b:#124c87;--l:#e9eef4;--g:#16844a}
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#111}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;padding:14px}
h1{font-size:20px;margin:0}.w{color:#dbeafe}.m{max-width:600px;margin:auto;padding:10px 10px 100px}
.c{background:#fff;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
.r{display:flex;gap:8px;align-items:center}.b{justify-content:space-between}.s{font-size:12px;color:#697586}
.p{font-size:20px;font-weight:800}.in{font-size:20px;font-weight:800}.sc{font-size:34px;font-weight:900}
button{border:0;border-radius:11px;background:var(--l);color:#153e66;font-size:16px;font-weight:700;min-height:48px;padding:9px}
button.primary{background:var(--b);color:#fff}button.green{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.tab{display:flex;gap:7px}.tab button{flex:1}.sel{outline:3px solid #1c70b7}.hide{display:none}
.log{padding:9px 3px;border-bottom:1px solid #edf0f3}
.st{display:grid;grid-template-columns:35px 1fr;gap:6px;align-items:center;margin:6px 0}
.note{background:#fff8df;border-radius:10px;padding:9px;font-size:13px}
input,textarea{font:inherit;width:100%;border:1px solid #d9e0e8;border-radius:10px;padding:11px}
textarea{min-height:180px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:22px;display:none;z-index:20}
.progress{background:#eef2f6;border-radius:10px;height:10px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;width:0;background:#16844a;transition:.2s}
.ocrbox{background:#f7f9fb;border-radius:10px;padding:9px;margin-top:9px}.small{font-size:13px;color:#586575}.photo{display:none}
</style>
</head>
<body>
<header><h1>⚾ 浜松南 野球速報</h1><div class="w">スタメン・入力内容はこのiPhoneに自動保存</div></header>
<main class="m">

<section class="c">
<div class="r b"><div><div class="s">試合設定</div><div class="p">先攻・後攻 / スタメン</div></div><button id="set" class="primary">設定・編集</button></div>
<div id="sum" style="margin-top:8px"></div>
<div id="setup" class="hide" style="margin-top:10px">
<div class="s">浜松南の攻撃順</div>
<div class="grid2" style="margin:7px 0"><button id="first">先攻</button><button id="second">後攻</button></div>
<div class="note"><b>新機能：メンバー表写真を読み取り</b><br>LINEで届いたメンバー表を写真からOCRで読み取り、9人の名前欄へ反映できます。読み取り後は必ず名前を確認・修正してください。</div>
<input id="photo" class="photo" type="file" accept="image/*">
<button id="ocr" class="green" style="width:100%;margin-top:8px">📷 メンバー表の写真を読み取る</button>
<div id="ocrStatus" class="small" style="margin-top:7px"></div>
<div class="progress hide" id="prog"><i id="bar"></i></div>
<div id="ocrResult" class="ocrbox hide">
<div class="small">読み取った文字（必要なら修正できます）</div>
<textarea id="ocrText" style="min-height:130px;margin-top:6px"></textarea>
<button id="applyOcr" class="green" style="width:100%;margin-top:7px">読み取り結果から9人を反映</button>
</div>
<div id="edit" style="margin-top:9px"></div>
<button id="save" class="green" style="width:100%;margin-top:7px">スタメンを保存して試合開始</button>
</div>
</section>

<section class="c">
<div class="r b"><div><div class="s">現在の攻撃</div><div class="in" id="inn">1回表</div></div>
<div style="text-align:right"><div class="s">浜松南</div><div class="sc" id="score">0</div></div></div>
<div class="tab" style="margin-top:10px"><button id="prev">‹ 前</button><button id="now" class="primary">1回表</button><button id="next">次 ›</button></div>
</section>

<section class="c">
<div class="r b"><div><div class="s">現在の打者</div><div class="p" id="bat">1番　選手名未登録</div></div><div class="s" id="slot">打順 1番</div></div>
<div style="height:9px"></div><div class="grid" id="results"></div>
</section>

<section class="c hide" id="pos">
<div class="p">相手の守備位置</div><div class="s">必要なプレーだけ選択してください</div>
<div class="grid" id="positions" style="margin-top:8px"></div>
<button id="nop" style="width:100%;margin-top:8px">守備位置なしで確定</button>
</section>

<section class="c">
<div class="grid2"><button id="confirm" class="primary">この打席を確定</button><button id="nextbat">次の打者</button></div>
<div style="height:7px"></div><div class="grid2"><button id="sub">選手交代</button><button id="undo">↩ 1つ戻す</button></div>
</section>

<section class="c">
<div class="r b"><div class="p">このイニング</div><button id="clear">イニング取消</button></div><div id="logs"></div>
</section>

<section class="c">
<div class="r b"><div class="p">速報</div><button id="make" class="green">速報を作成</button></div>
<div id="post" class="hide" style="margin-top:9px"><textarea id="text"></textarea>
<div class="grid2" style="margin-top:8px"><button id="copy">コピー</button><button id="share" class="green">共有</button></div></div>
</section>

<section class="c hide" id="subcard">
<div class="p">選手交代</div><div class="s">交代前 → 交代後</div>
<div class="grid2"><input id="out" placeholder="交代する選手"><input id="into" placeholder="入る選手"></div>
<button id="savesub" class="green" style="width:100%;margin-top:8px">交代を記録</button>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
const K='hamamatsu_live_v6',
R=['ヒット','2塁打','3塁打','本塁打','四球','死球','犠打','犠飛','三振','ゴロ','フライ','エラー','その他'],
P=['投手','捕手','一塁','二塁','三塁','遊撃','左翼','中堅','右翼'];

let st=JSON.parse(localStorage.getItem(K)||'null')||
{inning:1,half:'表',score:0,batter:0,members:Array(9).fill('選手名未登録'),
battingFirst:true,plays:[],pending:null};

const $=id=>document.getElementById(id),
save=()=>localStorage.setItem(K,JSON.stringify(st));

function toast(t){$('toast').textContent=t;$('toast').style.display='block';
clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1600)}

function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
.replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function setup(){
$('first').className=st.battingFirst?'primary':'';
$('second').className=!st.battingFirst?'primary':'';
$('edit').innerHTML=st.members.map((n,i)=>
`<div class="st"><b>${i+1}番</b><input data-i="${i}" value="${esc(n)}" placeholder="${i+1}番 選手名"></div>`).join('');
$('sum').innerHTML=`<b>${st.battingFirst?'先攻':'後攻'}</b>　スタメン ${st.members.filter(x=>x&&x!=='選手名未登録').length}/9人登録済み`
}

function render(){
$('inn').textContent=st.inning+'回'+st.half;$('now').textContent=st.inning+'回'+st.half;
$('score').textContent=st.score;$('bat').textContent=(st.batter+1)+'番　'+(st.members[st.batter]||'選手名未登録');
$('slot').textContent='打順 '+(st.batter+1)+'番';
let a=st.plays.filter(p=>p.inning===st.inning&&p.half===st.half);
$('logs').innerHTML=a.length?a.map(p=>
`<div class="log">${p.type==='交代'?'選手交代：'+esc(p.out)+' → '+esc(p.in):
esc(p.name)+'：<b>'+esc(p.result)+'</b>'+(p.pos?'（'+esc(p.pos)+'）':'')}</div>`).join(''):
'<div class="s">まだ入力されていません</div>';
setup();save()
}

function finish(){
if(!st.pending)return;
let n=st.members[st.batter]||'選手名未登録';
st.plays.push({type:'打席',inning:st.inning,half:st.half,name:n,result:st.pending.result,pos:st.pending.pos});
if(st.pending.result==='本塁打')st.score++;
st.pending=null;$('pos').classList.add('hide');
document.querySelectorAll('.result').forEach(x=>x.classList.remove('sel'));
st.batter=(st.batter+1)%9;render();toast('記録して次の打者へ')
}

$('results').innerHTML=R.map(x=>`<button class="result">${x}</button>`).join('');
document.querySelectorAll('.result').forEach(b=>b.onclick=()=>{
let r=b.textContent;st.pending={result:r,pos:''};
document.querySelectorAll('.result').forEach(x=>x.classList.toggle('sel',x.textContent===r));
if(['ヒット','2塁打','3塁打','本塁打','犠打','犠飛','ゴロ','フライ'].includes(r)){
$('pos').classList.remove('hide');toast('守備位置を選択してください')}else finish()
});

$('positions').innerHTML=P.map(x=>`<button>${x}</button>`).join('');
document.querySelectorAll('#positions button').forEach(b=>b.onclick=()=>{
if(st.pending){st.pending.pos=b.textContent;finish()}
});
$('nop').onclick=finish;
$('confirm').onclick=()=>st.pending?finish():toast('結果を選択してください');
$('nextbat').onclick=()=>{st.batter=(st.batter+1)%9;render()};

function half(d){
if(d>0){if(st.half==='表')st.half='裏';else{st.half='表';st.inning++}}
else{if(st.half==='裏')st.half='表';else if(st.inning>1){st.inning--;st.half='裏'}}
st.batter=0;st.pending=null;$('pos').classList.add('hide');render()
}
$('next').onclick=()=>half(1);$('prev').onclick=()=>half(-1);

$('undo').onclick=()=>{
if(!st.plays.length)return toast('戻せる入力がありません');
let p=st.plays.pop();if(p.result==='本塁打')st.score--;
if(p.type==='打席')st.batter=(st.batter+8)%9;render()
};

$('clear').onclick=()=>{
st.plays=st.plays.filter(p=>!(p.inning===st.inning&&p.half===st.half));
st.batter=0;render()
};

$('sub').onclick=()=>$('subcard').classList.toggle('hide');

$('savesub').onclick=()=>{
let o=$('out').value.trim(),i=$('into').value.trim();
if(!o||!i)return toast('交代前・交代後を入力してください');
let idx=st.members.indexOf(o);if(idx>=0)st.members[idx]=i;
st.plays.push({type:'交代',inning:st.inning,half:st.half,out:o,in:i});
$('out').value='';$('into').value='';render();toast('選手交代を記録しました')
};

$('make').onclick=()=>{
let a=st.plays.filter(p=>p.inning===st.inning&&p.half===st.half);
let lines=a.map(p=>p.type==='交代'?`選手交代：${p.out} → ${p.in}`:
`${p.name}：${p.result}${p.pos?'（'+p.pos+'）':''}`);
$('text').value=`【${st.inning}回${st.half}】\n${lines.join('\n')}\n\n浜松南 ${st.score}`;
$('post').classList.remove('hide')
};

$('copy').onclick=async()=>{
try{await navigator.clipboard.writeText($('text').value)}
catch(e){$('text').select();document.execCommand('copy')}
toast('速報をコピーしました')
};

$('share').onclick=async()=>{
if(navigator.share)try{await navigator.share({text:$('text').value})}catch(e){}
else $('copy').click()
};

$('set').onclick=()=>{$('setup').classList.toggle('hide');setup()};
$('first').onclick=()=>{st.battingFirst=true;setup()};
$('second').onclick=()=>{st.battingFirst=false;setup()};
$('save').onclick=()=>{
document.querySelectorAll('#edit input').forEach(x=>
st.members[+x.dataset.i]=x.value.trim()||'選手名未登録');
st.batter=0;save();$('setup').classList.add('hide');render();toast('スタメンを保存しました')
};

// メンバー表写真OCR
$('ocr').onclick=()=>$('photo').click();

function makeOCRImage(file, mode){
return new Promise((resolve,reject)=>{
const img=new Image(), url=URL.createObjectURL(file);
img.onload=()=>{
const scale=mode===0?2.5:3.0;
const c=document.createElement('canvas');
c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);
const x=c.getContext('2d',{willReadFrequently:true});
x.drawImage(img,0,0,c.width,c.height);
let d=x.getImageData(0,0,c.width,c.height), a=d.data;
for(let i=0;i<a.length;i+=4){
let y=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
if(mode===1){y=Math.max(0,Math.min(255,(y-128)*1.8+128))}
if(mode===2){y=y>155?255:0}
a[i]=a[i+1]=a[i+2]=y;
}
x.putImageData(d,0,0);URL.revokeObjectURL(url);
resolve(c.toDataURL('image/jpeg',0.95));
};img.onerror=reject;img.src=url;
});
}

$('photo').onchange=async e=>{
const file=e.target.files&&e.target.files[0];if(!file)return;
$('ocrResult').classList.add('hide');$('prog').classList.remove('hide');
$('bar').style.width='2%';$('ocrStatus').textContent='写真を前処理しています…';
try{
const texts=[];
for(let mode=0;mode<3;mode++){
$('ocrStatus').textContent='メンバー表を高画質で読み取り中… '+(mode+1)+'/3';
const img=await makeOCRImage(file,mode);
const result=await Tesseract.recognize(img,'jpn',{
logger:m=>{
if(m.status==='recognizing text'){
let pct=Math.round((m.progress||0)*100/3+(mode*100/3));
$('bar').style.width=pct+'%';
}}
});
texts.push(result.data.text||'');
}
let text=texts.sort((a,b)=>b.length-a.length)[0];
$('ocrText').value=text;
$('ocrResult').classList.remove('hide');
$('bar').style.width='100%';
$('ocrStatus').textContent='3種類の画像処理で読み取りました。文字化けしている部分は下の欄で修正できます。';
toast('高精度OCRが完了しました')
}catch(err){
console.error(err);
$('ocrStatus').textContent='読み取りに失敗しました。写真を明るく、真上から撮影してください。';
toast('OCRに失敗しました')
}finally{setTimeout(()=>$('prog').classList.add('hide'),800)}
};

function cleanLine(s){
return s.replace(/[\u3000]/g,' ')
.replace(/^[^\p{L}\p{N}一-龯ぁ-んァ-ヶ]*[0-9０-９]{1,2}[\s\.、:：)）-]*/u,'')
.trim();
}

$('applyOcr').onclick=()=>{
let raw=$('ocrText').value.split(/\n+/).map(cleanLine).filter(Boolean);
let candidates=[];
for(let line of raw){
let x=line
.replace(/[|｜]/g,' ')
.replace(/\s+/g,' ')
.replace(/^(?:浜松南|野球部|メンバー表|打順|背番号|守備|氏名)\s*/,'')
.trim();

x=x.replace(/(?:投手|捕手|一塁手|二塁手|三塁手|遊撃手|左翼手|中堅手|右翼手|投|捕|一|二|三|遊|左|中|右)\s*$/,'').trim();
x=x.replace(/^[^\u3400-\u9fffぁ-んァ-ヶー]+/,'').trim();

if(x && x.length>=2 && x.length<=12 &&
/[\u3400-\u9fffぁ-んァ-ヶー]/.test(x) &&
!/^(?:浜松南|選手名|氏名|背番号|守備|打順|メンバー|控え|監督|記録員)$/.test(x))
candidates.push(x);
}

let unique=[...new Set(candidates)];
if(unique.length<1)
return toast('名前を抽出できませんでした。読み取り文字欄を修正してから再度「9人を反映」を押してください');

unique.slice(0,9).forEach((n,i)=>{st.members[i]=n});
render();$('ocrResult').classList.add('hide');
toast(Math.min(unique.length,9)+'人をスタメン欄へ反映しました。必ず名前を確認してください')
};

render();$('ocrResult').classList.add('hide');
toast(Math.min(unique.length,9)+'人をスタメン欄へ反映しました。確認してください')
};

render();
</script>
</body>
</html>
