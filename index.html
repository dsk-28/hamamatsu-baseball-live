<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>浜松南 野球速報 実用版</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--b:#124c87;--l:#e9eef4;--g:#16844a;--y:#fff8df}
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#111}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;padding:14px}
h1{font-size:20px;margin:0}.w{color:#dbeafe}.m{max-width:600px;margin:auto;padding:10px 10px 100px}
.c{background:#fff;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
.r{display:flex;gap:8px;align-items:center}.b{justify-content:space-between}.s{font-size:12px;color:#697586}.p{font-size:20px;font-weight:800}.in{font-size:20px;font-weight:800}.sc{font-size:34px;font-weight:900}
button{border:0;border-radius:11px;background:var(--l);color:#153e66;font-size:16px;font-weight:700;min-height:48px;padding:9px}
button.primary{background:var(--b);color:#fff}button.green{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.tab{display:flex;gap:7px}.tab button{flex:1}.sel{outline:3px solid #1c70b7}.hide{display:none}
.log{padding:9px 3px;border-bottom:1px solid #edf0f3}
.st{display:grid;grid-template-columns:35px 1fr 42px;gap:6px;align-items:center;margin:6px 0;touch-action:none}
.st input{min-width:0}.move{display:flex;gap:3px}.move button{min-height:42px;padding:5px;font-size:17px}
.note{background:var(--y);border-radius:10px;padding:10px;font-size:13px;line-height:1.5}
input,textarea{font:inherit;width:100%;border:1px solid #d9e0e8;border-radius:10px;padding:11px}
textarea{min-height:180px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:22px;display:none;z-index:20;max-width:90%;text-align:center}
.progress{background:#eef2f6;border-radius:10px;height:10px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;width:0;background:#16844a;transition:.2s}
.ocrbox{background:#f7f9fb;border-radius:10px;padding:9px;margin-top:9px}.small{font-size:13px;color:#586575}.photo{display:none}
.preview{width:100%;border-radius:10px;margin-top:8px;display:none}
.warn{background:#fff1f1;border:1px solid #f0caca;border-radius:10px;padding:9px;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header><h1>⚾ 浜松南 野球速報</h1><div class="w">スタメン・入力内容はこのiPhoneに自動保存</div></header>
<main class="m">

<section class="c">
<div class="r b"><div><div class="s">試合設定</div><div class="p">先攻・後攻 / スタメン</div></div><button id="set" class="primary">設定・編集</button></div>
<div id="sum" style="margin-top:8px"></div>
<div id="setup" class="hide" style="margin-top:10px">
<div class="s">浜松南の攻撃順</div>
<div class="grid2" style="margin:7px 0"><button id="first">先攻</button><button id="second">後攻</button></div>

<div class="note">
<b>📷 メンバー表写真を読み取る</b><br>
今回は写真の<strong>右側の9人の名前欄を優先して読み取ります</strong>。写真全体をそのまま読むのではなく、名簿部分を拡大・白黒化して1人ずつOCRする方式です。<br>
読み取り後は必ず名前を確認してください。
</div>

<input id="photo" class="photo" type="file" accept="image/*" capture="environment">
<button id="ocr" class="green" style="width:100%;margin-top:8px">📷 写真を選択して読み取る</button>
<div id="ocrStatus" class="small" style="margin-top:7px"></div>
<div class="progress hide" id="prog"><i id="bar"></i></div>
<img id="preview" class="preview">
<div id="ocrResult" class="ocrbox hide">
<div class="small">OCR結果（必要ならここで直接修正できます）</div>
<textarea id="ocrText" style="min-height:130px;margin-top:6px"></textarea>
<button id="applyOcr" class="green" style="width:100%;margin-top:7px">読み取り結果から9人を反映</button>
</div>
<div id="edit" style="margin-top:9px"></div>
<button id="save" class="green" style="width:100%;margin-top:7px">スタメンを保存して試合開始</button>
</div>
</section>

<section class="c">
<div class="r b"><div><div class="s">現在の攻撃</div><div class="in" id="inn">1回表</div></div>
<div style="text-align:right"><div class="s">浜松南</div><div class="sc" id="score">0</div></div></div>
<div class="tab" style="margin-top:10px"><button id="prev">‹ 前</button><button id="now" class="primary">1回表</button><button id="next">次 ›</button></div>
</section>

<section class="c">
<div class="r b"><div><div class="s">現在の打者</div><div class="p" id="bat">1番　選手名未登録</div></div><div class="s" id="slot">打順 1番</div></div>
<div style="height:9px"></div><div class="grid" id="results"></div>
</section>

<section class="c hide" id="pos">
<div class="p">相手の守備位置</div><div class="s">必要なプレーだけ選択してください</div>
<div class="grid" id="positions" style="margin-top:8px"></div>
<button id="nop" style="width:100%;margin-top:8px">守備位置なしで確定</button>
</section>

<section class="c">
<div class="grid2"><button id="confirm" class="primary">この打席を確定</button><button id="nextbat">次の打者</button></div>
<div style="height:7px"></div><div class="grid2"><button id="sub">選手交代</button><button id="undo">↩ 1つ戻す</button></div>
</section>

<section class="c">
<div class="r b"><div class="p">このイニング</div><button id="clear">イニング取消</button></div><div id="logs"></div>
</section>

<section class="c">
<div class="r b"><div class="p">速報</div><button id="make" class="green">速報を作成</button></div>
<div id="post" class="hide" style="margin-top:9px"><textarea id="text"></textarea>
<div class="grid2" style="margin-top:8px"><button id="copy">コピー</button><button id="share" class="green">共有</button></div></div>
</section>

<section class="c hide" id="subcard">
<div class="p">選手交代</div><div class="s">交代前 → 交代後</div>
<div class="grid2"><input id="out" placeholder="交代する選手"><input id="into" placeholder="入る選手"></div>
<button id="savesub" class="green" style="width:100%;margin-top:8px">交代を記録</button>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
const K='hamamatsu_live_v8',
R=['ヒット','2塁打','3塁打','本塁打','四球','死球','犠打','犠飛','三振','ゴロ','フライ','エラー','その他'],
P=['投手','捕手','一塁','二塁','三塁','遊撃','左翼','中堅','右翼'];

let st=JSON.parse(localStorage.getItem(K)||'null')||
{inning:1,half:'表',score:0,batter:0,members:Array(9).fill('選手名未登録'),battingFirst:true,plays:[],pending:null};

const $=id=>document.getElementById(id), save=()=>localStorage.setItem(K,JSON.stringify(st));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1900)}
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function setup(){
$('first').className=st.battingFirst?'primary':'';
$('second').className=!st.battingFirst?'primary':'';
$('edit').innerHTML=st.members.map((n,i)=>
`<div class="st" draggable="true" data-row="${i}">
<b>${i+1}番</b>
<input data-i="${i}" value="${esc(n)}" placeholder="${i+1}番 選手名">
<span class="move"><button type="button" data-up="${i}">▲</button><button type="button" data-down="${i}">▼</button></span>
</div>`).join('');
$('sum').innerHTML=`<b>${st.battingFirst?'先攻':'後攻'}</b>　スタメン ${st.members.filter(x=>x&&x!=='選手名未登録').length}/9人登録済み`;

document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveMember(+b.dataset.up,-1));
document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveMember(+b.dataset.down,1));

let dragIndex=null;
document.querySelectorAll('.st').forEach(row=>{
row.ondragstart=()=>{dragIndex=+row.dataset.row};
row.ondragover=e=>e.preventDefault();
row.ondrop=e=>{e.preventDefault();let to=+row.dataset.row;if(dragIndex!==null&&dragIndex!==to)moveMemberTo(dragIndex,to);dragIndex=null};
});
}

function moveMember(i,d){let j=i+d;if(j<0||j>8)return;moveMemberTo(i,j)}
function moveMemberTo(from,to){
let names=st.members.slice(),x=names.splice(from,1)[0];names.splice(to,0,x);st.members=names;setup();save();toast('打順を入れ替えました');
}

function render(){
$('inn').textContent=st.inning+'回'+st.half;$('now').textContent=st.inning+'回'+st.half;
$('score').textContent=st.score;$('bat').textContent=(st.batter+1)+'番　'+(st.members[st.batter]||'選手名未登録');
$('slot').textContent='打順 '+(st.batter+1)+'番';
let a=st.plays.filter(p=>p.inning===st.inning&&p.half===st.half);
$('logs').innerHTML=a.length?a.map(p=>`<div class="log">${p.type==='交代'?'選手交代：'+esc(p.out)+' → '+esc(p.in):esc(p.name)+'：<b>'+esc(p.result)+'</b>'+(p.pos?'（'+esc(p.pos)+'）':'')}</div>`).join(''):'<div class="s">まだ入力されていません</div>';
setup();save()
}

function finish(){
if(!st.pending)return;
let n=st.members[st.batter]||'選手名未登録';
st.plays.push({type:'打席',inning:st.inning,half:st.half,name:n,result:st.pending.result,pos:st.pending.pos});
if(st.pending.result==='本塁打')st.score++;
st.pending=null;$('pos').classList.add('hide');
document.querySelectorAll('.result').forEach(x=>x.classList.remove('sel'));
st.batter=(st.batter+1)%9;render();toast('記録して次の打者へ')
}

$('results').innerHTML=R.map(x=>`<button class="result">${x}</button>`).join('');
document.querySelectorAll('.result').forEach(b=>b.onclick=()=>{
let r=b.textContent;st.pending={result:r,pos:''};
document.querySelectorAll('.result').forEach(x=>x.classList.toggle('sel',x.textContent===r));
if(['ヒット','2塁打','3塁打','本塁打','犠打','犠飛','ゴロ','フライ'].includes(r)){$('pos').classList.remove('hide');toast('守備位置を選択してください')}else finish();
});
$('positions').innerHTML=P.map(x=>`<button>${x}</button>`).join('');
document.querySelectorAll('#positions button').forEach(b=>b.onclick=()=>{if(st.pending){st.pending.pos=b.textContent;finish()}});
$('nop').onclick=finish;$('confirm').onclick=()=>st.pending?finish():toast('結果を選択してください');
$('nextbat').onclick=()=>{st.batter=(st.batter+1)%9;render()};

function half(d){
if(d>0){if(st.half==='表')st.half='裏';else{st.half='表';st.inning++}}
else{if(st.half==='裏')st.half='表';else if(st.inning>1){st.inning--;st.half='裏'}}
st.batter=0;st.pending=null;$('pos').classList.add('hide');render()
}
$('next').onclick=()=>half(1);$('prev').onclick=()=>half(-1);

$('undo').onclick=()=>{
if(!st.plays.length)return toast('戻せる入力がありません');
let p=st.plays.pop();if(p.result==='本塁打')st.score--;
if(p.type==='打席')st.batter=(st.batter+8)%9;render()
};
$('clear').onclick=()=>{st.plays=st.plays.filter(p=>!(p.inning===st.inning&&p.half===st.half));st.batter=0;render()};
$('sub').onclick=()=>$('subcard').classList.toggle('hide');
$('savesub').onclick=()=>{
let o=$('out').value.trim(),i=$('into').value.trim();if(!o||!i)return toast('交代前・交代後を入力してください');
let idx=st.members.indexOf(o);if(idx>=0)st.members[idx]=i;
st.plays.push({type:'交代',inning:st.inning,half:st.half,out:o,in:i});
$('out').value='';$('into').value='';render();toast('選手交代を記録しました')
};
$('make').onclick=()=>{
let a=st.plays.filter(p=>p.inning===st.inning&&p.half===st.half);
let lines=a.map(p=>p.type==='交代'?`選手交代：${p.out} → ${p.in}`:`${p.name}：${p.result}${p.pos?'（'+p.pos+'）':''}`);
$('text').value=`【${st.inning}回${st.half}】\n${lines.join('\n')}\n\n浜松南 ${st.score}`;$('post').classList.remove('hide')
};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('text').value)}catch(e){$('text').select();document.execCommand('copy')}toast('速報をコピーしました')};
$('share').onclick=async()=>{if(navigator.share)try{await navigator.share({text:$('text').value})}catch(e){}else $('copy').click()};
$('set').onclick=()=>{$('setup').classList.toggle('hide');setup()};
$('first').onclick=()=>{st.battingFirst=true;setup();save()};
$('second').onclick=()=>{st.battingFirst=false;setup();save()};
$('save').onclick=()=>{
document.querySelectorAll('#edit input').forEach(x=>st.members[+x.dataset.i]=x.value.trim()||'選手名未登録');
st.batter=0;save();$('setup').classList.add('hide');render();toast('スタメンを保存しました')
};

/* ---------------- OCR改良版 ---------------- */
$('ocr').onclick=()=>$('photo').click();

function japaneseOnly(s){
return (s||'').replace(/[^\u3400-\u4DBF\u4E00-\u9FFF々〆〇ヶぁ-んァ-ヶー]/g,'');
}
function normalizeName(s){
let x=japaneseOnly(s);
x=x.replace(/^(選手|氏名|名前|打順|守備|背番号)+/,'');
if(x.length>7)x=x.slice(0,7);
return x;
}
function makeProcessed(src,mode){
return new Promise(resolve=>{
let im=new Image();
im.onload=()=>{
let W=im.naturalWidth,H=im.naturalHeight;
let sx,sy,sw,sh;
if(mode==='names'){
// 名簿が右側にある写真を想定。少し広めに切り、列を取りこぼさない。
sx=Math.floor(W*0.45);sy=Math.floor(H*0.10);sw=Math.floor(W*0.53);sh=Math.floor(H*0.78);
}else{sx=0;sy=0;sw=W;sh=H}
let scale=2.2,c=document.createElement('canvas');c.width=Math.floor(sw*scale);c.height=Math.floor(sh*scale);
let ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
let d=ctx.getImageData(0,0,c.width,c.height),p=d.data;
for(let i=0;i<p.length;i+=4){
let g=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
g=(g-128)*1.35+128;g=Math.max(0,Math.min(255,g));
p[i]=p[i+1]=p[i+2]=g;
}
ctx.putImageData(d,0,0);resolve(c);
};
im.src=src;
});
}

async function ocrOne(canvas,logger){
let r=await Tesseract.recognize(canvas,'jpn',{
logger,
});
return r.data.text||'';
}

$('photo').onchange=async e=>{
const file=e.target.files&&e.target.files[0];if(!file)return;
$('preview').src=URL.createObjectURL(file);$('preview').style.display='block';
$('ocrResult').classList.add('hide');$('prog').classList.remove('hide');$('bar').style.width='2%';
$('ocrStatus').textContent='写真を解析しています…';
try{
const src=URL.createObjectURL(file);
const crop=await makeProcessed(src,'names');
let all=[];
const W=crop.width,H=crop.height;

// 9段に分けて1人ずつ読む。行境界の誤差を吸収するため上下に少し余白を持たせる。
for(let i=0;i<9;i++){
let y0=Math.max(0,Math.floor(H*(i/9)-H*0.012));
let y1=Math.min(H,Math.floor(H*((i+1)/9)+H*0.012));
let row=document.createElement('canvas');row.width=W;row.height=y1-y0;
row.getContext('2d').drawImage(crop,0,y0,W,y1-y0,0,0,W,y1-y0);
let txt=await ocrOne(row,m=>{
if(m.status==='recognizing text'){
let pct=Math.round((i+(m.progress||0))/9*100);
$('bar').style.width=pct+'%';$('ocrStatus').textContent=`名前を読み取り中… ${i+1}/9`;
}});
let name=normalizeName(txt);
all.push(name);
}
let good=all.filter(x=>x.length>=2);
$('ocrText').value=all.map((x,i)=>`${i+1}. ${x||'（未読）'}`).join('\n');
$('ocrResult').classList.remove('hide');$('bar').style.width='100%';
$('ocrStatus').textContent=`9枠を解析しました。${good.length}/9人を認識。下で確認・修正してください。`;
toast(`${good.length}/9人を認識しました`);
URL.revokeObjectURL(src);
}catch(err){
console.error(err);
$('ocrStatus').textContent='読み取りに失敗しました。写真を選び直して、名簿が画面いっぱいに写る写真でもう一度お試しください。';
toast('OCRに失敗しました');
}finally{setTimeout(()=>$('prog').classList.add('hide'),700)}
};

$('applyOcr').onclick=()=>{
let lines=$('ocrText').value.split(/\n+/).map(s=>s.replace(/^\s*\d+\s*[.．、:：)]?\s*/,'').trim()).filter(Boolean);
let names=lines.map(normalizeName).filter(x=>x.length>=2);
if(!names.length)return toast('名前を抽出できませんでした。下の文字を修正してください');
for(let i=0;i<9;i++)st.members[i]=names[i]||st.members[i]||'選手名未登録';
render();$('ocrResult').classList.add('hide');toast(`${Math.min(names.length,9)}人をスタメン欄へ反映しました`);
};

render();
</script>
</body>
</html>
