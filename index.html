<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高校野球速報・浜松南</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#667085;--line:#d9dee5;--accent:#1266d6;--danger:#d92d20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}
h1{font-size:20px;margin:0 0 8px}.score{display:flex;gap:8px;align-items:center}.team{font-weight:700}.badge{padding:4px 8px;border-radius:999px;background:#eef4ff;color:#174ea6;font-size:12px}
main{max-width:760px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0000000b}
.row{display:flex;gap:8px;flex-wrap:wrap}.grow{flex:1 1 180px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
textarea{min-height:80px;resize:vertical}button{border:0;border-radius:10px;padding:11px 13px;background:#e9eef5;color:#17202a;font-weight:700}button.primary{background:var(--accent);color:#fff}button.danger{background:#fee4e2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{min-height:46px}.title{font-weight:800;font-size:16px;margin-bottom:10px}.small{font-size:12px;color:var(--muted)}
.order{display:grid;grid-template-columns:44px 1fr 90px 44px 44px;gap:6px;align-items:center;margin:6px 0}
.order .num{font-weight:800;text-align:center}.order button{padding:8px}
.pill{display:inline-block;background:#eef2f6;border-radius:999px;padding:5px 9px;font-size:12px;margin:2px}
#log{white-space:pre-wrap;background:#111827;color:#f9fafb;border-radius:10px;padding:12px;min-height:140px;font-size:14px;line-height:1.65}
.result{border-top:1px solid var(--line);padding:9px 0}.result:first-child{border-top:0}
.sticky-actions{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(8px);padding:8px 0;z-index:4}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.order{grid-template-columns:32px 1fr 72px 38px 38px}}
</style>
</head>
<body>
<header>
  <h1>⚾ 高校野球速報・浜松南</h1>
  <div class="score">
    <span class="team">浜松南</span><span id="myScore">0</span>
    <span>－</span><span id="oppNameHead">相手校</span><span id="oppScore">0</span>
    <span class="badge" id="halfLabel">1回表</span>
  </div>
</header>

<main>
<section class="card">
  <div class="title">① 試合設定</div>
  <div class="row">
    <div class="grow"><label>相手チーム名</label><input id="opp" placeholder="例：○○高校"></div>
    <div class="grow"><label>先攻・後攻</label><select id="orderMode"><option value="home">浜松南が先攻</option><option value="away">浜松南が後攻</option></select></div>
    <div class="grow"><label>回</label><input id="inning" type="number" min="1" value="1"></div>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="primary" id="start">設定を反映</button>
    <button id="toggleHalf">表／裏を切替</button>
  </div>
</section>

<section class="card">
  <div class="title">② スタメン</div>
  <div class="small">打順・守備位置はあとから上下ボタンで修正できます。</div>
  <div id="roster"></div>
  <div class="row" style="margin-top:8px">
    <button id="addPlayer">選手を追加</button>
    <button id="clearRoster" class="danger">全消去</button>
  </div>
</section>

<section class="card">
  <div class="title">③ 現在の攻撃</div>
  <div class="row">
    <div class="grow"><label>打者</label><select id="batter"></select></div>
    <div class="grow"><label>結果</label><select id="resultType">
      <option value="四球">四球</option><option value="死球">死球</option><option value="三振">三振</option>
      <option value="空振り三振">空振り三振</option><option value="見逃し三振">見逃し三振</option>
      <option value="内野ゴロ">内野ゴロ</option><option value="外野フライ">外野フライ</option>
      <option value="犠打">犠打</option><option value="犠飛">犠飛</option><option value="安打">安打</option>
      <option value="二塁打">二塁打</option><option value="三塁打">三塁打</option><option value="本塁打">本塁打</option>
      <option value="失策">失策</option><option value="野選">野選</option><option value="その他">その他</option>
    </select></div>
    <div class="grow"><label>相手守備位置</label><select id="pos">
      <option value="">なし</option><option>投手(1)</option><option>捕手(2)</option><option>一塁手(3)</option>
      <option>二塁手(4)</option><option>三塁手(5)</option><option>遊撃手(6)</option>
      <option>左翼手(7)</option><option>中堅手(8)</option><option>右翼手(9)</option>
    </select></div>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="primary" id="addPlay">打席を記録</button>
    <button id="advance">盗塁・WP等を入力</button>
  </div>
  <textarea id="comment" placeholder="自由コメント（例：盗塁成功、ワイルドピッチで二塁へ進塁）" style="margin-top:8px"></textarea>
</section>

<section class="card">
  <div class="title">④ 交代・守備記録</div>
  <div class="row">
    <button id="playerSub">選手交代</button>
    <button id="pitchSub">投手交代</button>
    <button id="defPlay">守備の記録</button>
  </div>
  <div id="subArea" style="margin-top:10px"></div>
</section>

<section class="card">
  <div class="title">⑤ 速報</div>
  <div id="log">まだ記録はありません。</div>
  <div class="sticky-actions">
    <div class="row">
      <button class="primary" id="copy">速報をコピー</button>
      <button id="newInning">次の回へ</button>
      <button class="danger" id="undo">1つ戻す</button>
    </div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const state={opp:"相手校",mode:"home",inning:1,half:"表",myScore:0,oppScore:0,roster:[],plays:[],history:[]};
const defaultRoster=["","","","","","","","",""];
function save(){localStorage.setItem("hamamatsu_minami_baseball",JSON.stringify(state))}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem("hamamatsu_minami_baseball")||"{}"))}catch(e){}}
function snapshot(){state.history.push(JSON.stringify({roster:state.roster,plays:state.plays,inning:state.inning,half:state.half,myScore:state.myScore,oppScore:state.oppScore}));if(state.history.length>50)state.history.shift()}
function renderRoster(){
  const r=$("roster"); r.innerHTML="";
  if(!state.roster.length) state.roster=defaultRoster.map((name,i)=>({name,position:"",active:true}));
  state.roster.forEach((p,i)=>{
    const d=document.createElement("div");d.className="order";
    d.innerHTML=`<div class="num">${i+1}</div><input data-i="${i}" class="rn" value="${esc(p.name||"")}" placeholder="選手名"><input data-i="${i}" class="rp" value="${esc(p.position||"")}" placeholder="守備"><button data-up="${i}">↑</button><button data-down="${i}">↓</button>`;
    r.appendChild(d);
  });
  r.querySelectorAll(".rn").forEach(x=>x.oninput=()=>{state.roster[+x.dataset.i].name=x.value;save();renderBatter()});
  r.querySelectorAll(".rp").forEach(x=>x.oninput=()=>{state.roster[+x.dataset.i].position=x.value;save()});
  r.querySelectorAll("[data-up]").forEach(x=>x.onclick=()=>move(+x.dataset.up,-1));
  r.querySelectorAll("[data-down]").forEach(x=>x.onclick=()=>move(+x.dataset.down,1));
  renderBatter();
}
function move(i,d){let j=i+d;if(j<0||j>=state.roster.length)return;snapshot();[state.roster[i],state.roster[j]]=[state.roster[j],state.roster[i]];save();renderRoster()}
function renderBatter(){const b=$("batter");b.innerHTML="";state.roster.forEach((p,i)=>{let o=document.createElement("option");o.value=i;o.textContent=`${i+1}番 ${p.name||"（未入力）"}`;b.appendChild(o)})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function isOwnAttack(){return state.mode==="home" ? state.half==="表" : state.half==="裏"}
function renderHeader(){ $("oppNameHead").textContent=state.opp||"相手校";$("myScore").textContent=state.myScore;$("oppScore").textContent=state.oppScore;$("halfLabel").textContent=`${state.inning}回${state.half}` }
function playText(p){return `${p.inning}回${p.half} ${p.text}`}
function renderLog(){renderHeader();$("log").textContent=state.plays.length?state.plays.map(playText).join("\n"):"まだ記録はありません。"}
function add(text){snapshot();state.plays.push({inning:state.inning,half:state.half,text});save();renderLog()}
$("start").onclick=()=>{state.opp=$("opp").value.trim()||"相手校";state.mode=$("orderMode").value;state.inning=Math.max(1,+$("inning").value||1);state.half="表";save();renderLog()}
$("toggleHalf").onclick=()=>{snapshot();state.half=state.half==="表"?"裏":"表";if(state.half==="表")state.inning++;save();renderLog()}
$("addPlay").onclick=()=>{
 const i=+$("batter").value,p=state.roster[i]||{},res=$("resultType").value,pos=$("pos").value;
 let text=`${i+1}番 ${p.name||"打者"}：${res}${pos?"（"+pos+"）":""}`;
 if($("comment").value.trim())text+=`。${$("comment").value.trim()}`;
 add(text);$("comment").value="";
}
$("advance").onclick=()=>{let c=$("comment").value.trim();if(!c){alert("コメントを入力してください");return}add(c);$("comment").value=""}
$("defPlay").onclick=()=>{let c=prompt("守備の記録を入力してください（選手名は不要）");if(c)add(`守備：${c}`)}
$("playerSub").onclick=()=>{
 $("subArea").innerHTML=`<div class="row"><div class="grow"><label>交代前</label><select id="out">${state.roster.map((p,i)=>`<option value="${i}">${i+1}番 ${esc(p.name||"未入力")}</option>`).join("")}</select></div><div class="grow"><label>交代後の選手名</label><input id="in" placeholder="選手名"></div><button class="primary" id="doSub">交代を記録</button></div>`;
 $("doSub").onclick=()=>{let i=+$("out").value,n=$("in").value.trim();if(!n)return;let old=state.roster[i].name||"未入力";snapshot();state.roster[i].name=n;add(`選手交代：${i+1}番 ${old} → ${n}`);renderRoster();$("subArea").innerHTML=""}
}
$("pitchSub").onclick=()=>{
 const own=isOwnAttack();
 const target=own?"相手チームの投手":"浜松南の投手";
 $("subArea").innerHTML=`<div class="row"><div class="grow"><label>${target}</label><input id="pitcher" placeholder="投手名（任意）"></div><button class="primary" id="doPitch">投手交代を記録</button></div><div class="small" style="margin-top:6px">現在は${isOwnAttack()?"浜松南の攻撃":"相手チームの攻撃"}なので、${target}の交代として記録します。</div>`;
 $("doPitch").onclick=()=>{let n=$("pitcher").value.trim();add(`投手交代：${target}${n?"「"+n+"」":""}`);$("subArea").innerHTML=""}
}
$("addPlayer").onclick=()=>{snapshot();state.roster.push({name:"",position:"",active:true});renderRoster();save()}
$("clearRoster").onclick=()=>{if(confirm("スタメンを全消去しますか？")){snapshot();state.roster=[];renderRoster();save()}}
$("undo").onclick=()=>{let x=state.history.pop();if(!x){alert("戻せる記録がありません");return}let o=JSON.parse(x);Object.assign(state,o);save();renderRoster();renderLog()}
$("newInning").onclick=()=>{snapshot();if(state.half==="表")state.half="裏";else{state.half="表";state.inning++}save();renderLog()}
$("copy").onclick=async()=>{
 let txt=`【高校野球速報】\n${state.inning}回${state.half}\n浜松南 ${state.myScore}－${state.opp} ${state.oppScore}\n\n`+(state.plays.length?state.plays.map(playText).join("\n"):"記録なし");
 try{await navigator.clipboard.writeText(txt);alert("速報をコピーしました。LINEに貼り付けできます。")}catch(e){prompt("コピーできない場合は、下の文章を長押ししてコピーしてください。",txt)}
}
load(); if(!state.roster.length)state.roster=defaultRoster.map(name=>({name,position:"",active:true}));
$("opp").value=state.opp||"";$("orderMode").value=state.mode||"home";$("inning").value=state.inning||1;
renderRoster();renderLog();
</script>
</body>
</html>
