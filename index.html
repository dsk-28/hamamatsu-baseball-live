<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>浜松南 野球速報 v14</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#17202a;--muted:#667085;--line:#dfe3e8;--accent:#1677ff;--danger:#e5484d;--green:#16803c}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.app{max-width:720px;margin:auto;padding-bottom:48px}
.top{position:sticky;top:0;z-index:30;background:rgba(245,247,250,.97);backdrop-filter:blur(12px);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.score-title{font-weight:900;font-size:14px;color:var(--muted);margin-bottom:5px}
.score-wrap{overflow-x:auto;border:1px solid #cfd5dc;border-radius:14px;background:#fff}
.score{border-collapse:collapse;min-width:680px;width:100%;font-size:13px;text-align:center}
.score th,.score td{border-right:1px solid var(--line);padding:6px 7px;white-space:nowrap}
.score th:first-child,.score td:first-child{position:sticky;left:0;background:#fff;text-align:left;font-weight:900;min-width:92px}
.score .total{font-size:15px;font-weight:900}.score-input{width:42px;min-width:42px;border:0;background:transparent;padding:4px 0;text-align:center;font-weight:800;font-size:15px;border-radius:6px}.score-input:focus{outline:2px solid var(--accent);background:#eef4ff}
.game-head{padding:2px 0 8px;text-align:center}.game-title{font-size:18px;font-weight:900}.game-match{font-size:16px;font-weight:800;margin-top:2px}.game-time{font-size:14px;color:var(--muted);margin-top:3px}
.score-edit-panel{margin:8px 12px 0;padding:10px;scroll-margin-top:115px}
main{padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h1{font-size:20px;margin:2px 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:13px;color:var(--muted);font-weight:800;display:block;margin-bottom:6px}
input,select,textarea{font:inherit;border:1px solid #cfd5dc;border-radius:10px;padding:10px;background:#fff;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-flex;padding:8px 11px;border-radius:999px;background:#eef4ff;color:#1459b8;font-weight:900;font-size:13px}
button{border:0;border-radius:11px;padding:11px 13px;background:#eef1f5;color:#17202a;font-weight:900;font-size:15px;cursor:pointer}
button.primary{background:var(--accent);color:#fff}button.selected{background:#17202a;color:#fff}button.danger{background:#fff0f0;color:var(--danger)}
button.small{font-size:13px;padding:8px 10px}.notice{font-size:12px;color:var(--muted);line-height:1.5}
.batting-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.batting-item{display:grid;grid-template-columns:38px 1fr;gap:6px;align-items:center}.batting-no{text-align:center;font-weight:900}
.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.result-grid button{min-height:52px}
.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.subgrid button{min-height:44px}.section-title{font-weight:900;font-size:15px;margin-bottom:8px}
.plusrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}.plusrow button{width:48px;height:44px;padding:0;font-size:25px}.runs{font-size:28px;font-weight:900;min-width:35px;text-align:center}
.bases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.base{padding:12px 5px;text-align:center;border:1px solid #cfd5dc;border-radius:12px;background:#fff;font-weight:900}.base.on{background:#eaf7ef;border-color:#8bc59d;color:#14652d}
.event-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.event-grid button{min-height:48px}
.preview{white-space:pre-wrap;background:#101214;color:#f5f5f5;border-radius:12px;padding:14px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;line-height:1.65;overflow:auto}
.history{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.entry{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hidden{display:none!important}.status{font-weight:900;margin:8px 0}.green{color:var(--green)}
@media(max-width:430px){.two,.batting-grid{grid-template-columns:1fr}.subgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div id="lineGameHeader" class="game-head"></div><div class="score-title">スコアボード</div>
  <div class="score-wrap"><table class="score" id="scoreTable"></table></div>
<div class="notice" style="margin-top:7px;text-align:center">各イニングの得点をここへ直接入力できます</div>
</header>

<main>
<section class="card">
<h1>浜松南 野球速報</h1>
<div class="two">
<div><label>試合名</label><input id="gameTitle" placeholder="例：OPEN戦①"></div>
<div><label>相手校</label><input id="opponent" placeholder="相手校名"></div>
</div>
<div class="two" style="margin-top:8px">
<div><label>先攻・後攻</label><select id="battingFirst"><option value="top">浜松南が先攻</option><option value="bottom">浜松南が後攻</option></select></div>
<div><label>開始時刻</label><input id="startTime" type="time"></div>
</div>
<div class="two" style="margin-top:8px">
<div><label>終了時刻</label><input id="endTime" type="time"></div>
<div class="two"><button id="setStartNow">開始を今の時刻に</button><button id="setEndNow">終了を今の時刻に</button></div>
</div>
<div style="margin-top:8px" class="two">
<div><label>現在のイニング</label><select id="inning"></select></div>
<div><label>現在の攻撃</label><div id="sideLabel" class="pill"></div></div>
</div>
<div class="two" style="margin-top:10px">
<button class="danger" id="clearGame">速報データを全消去</button>
<button class="primary" id="newGame">新しい試合を開始</button>
</div>
</section>

<section class="card">
<label>自チーム打順登録</label>
<div class="batting-grid" id="battingOrderInputs"></div>
<button class="primary" style="width:100%;margin-top:10px" id="saveBattingOrder">打順を登録</button>
</section>

<section class="card">
<button id="toggleMembers" style="width:100%">メンバー表を表示</button>
<div id="memberManagement" class="hidden" style="margin-top:12px">
<label>自チームメンバー管理</label>
<div class="notice" style="margin-bottom:8px">新入生の追加、名前の変更、卒業・退部した選手の非表示ができます。ここで登録した現役選手が打順登録の候補になります。</div>
<div class="two">
<input id="memberNameInput" placeholder="新しい選手名">
<button class="primary" id="addMember">メンバーを追加</button>
</div>
<div id="memberList" class="history"></div>
</section>

<section class="card">
<label>現在の打者</label>
<div class="two">
<div><label>通常は自動で次の打者へ</label><div id="batterName" style="font-size:22px;font-weight:900;text-align:center;padding:10px;background:#f3f5f8;border-radius:10px">打者</div></div>
<div><label>途中から再開するとき</label><select id="resumeBatter"></select></div>
</div>
<div class="notice" style="margin-top:8px">通常は打席を記録すると自動で次の打者へ進みます。途中のイニングから再開するときだけ、ここで打者を選択してください。</div>
</section>

<section class="card">
<div class="section-title">打席結果</div>
<div id="resultDetails" class="result-grid"></div>
<div class="notice" id="resultNotice" style="margin-top:8px">打席結果を選択して、「この打席を記録」を押してください。得点が0点でも記録できます。</div>

<div style="margin-top:12px">
<label>守備位置（必要なときだけ）</label>
<div id="positions" class="subgrid"></div>
</div>

<div style="margin-top:12px">
<label>この打席で入った得点</label>
<div class="plusrow"><button id="minusRun">−</button><div class="runs" id="runCount">0</div><button class="primary" id="plusRun">＋</button></div>
</div>
<button class="primary" style="width:100%" id="saveAtBat">この打席を記録</button>
</section>

<section class="card">
<label>現在のイニング速報（表・裏）</label>
<div id="currentInning" class="history"></div>
<div class="section-title" style="margin-top:14px">走塁プレーを追記</div>
<div class="event-grid">
<button id="stealEvent">盗塁</button><button id="pickoffEvent">牽制アウト</button>
<button id="wildEvent">暴投・捕逸</button><button id="advanceEvent">進塁</button>
<button id="scoreEvent">走者生還（得点）</button><button id="runnerComment">自由入力</button>
</div>
<div style="margin-top:8px"><textarea id="runnerCommentText" rows="2" placeholder="例：二盗成功、三盗を試み牽制アウト、暴投で二塁へ進塁"></textarea></div>
<button class="primary" style="width:100%;margin-top:8px" id="saveRunnerEvent">現在の速報に追記</button>
<div class="two" style="margin-top:10px">
<button id="nextHalf" class="primary">次の攻撃へ</button>
<button id="undoPlay" class="danger">1プレー戻す</button>
</div>
<button id="clearCurrent" class="small danger" style="width:100%;margin-top:8px">現在の攻撃を全て消す</button>
</section>

<section class="card">
<label>LINE送信用速報（1イニング・表＋裏）</label>
<div id="preview" class="preview"></div>
<button class="primary" style="width:100%;margin-top:10px" id="copy">この1イニング（表＋裏）をコピー</button>
</section>
</main>
</div>

<script>
const initialMembers=["齊藤","鈴木","山本","本間","宮崎","篠原","馬渡","中川","永井","太田","伊藤","西岡"];
const resultGroups={
"アウト":["三振","ゴロアウト","フライアウト","ライナーアウト"],
"ヒット":["単打","二塁打","三塁打","本塁打"],
"四死球":["四球","死球"],
"犠打・犠飛":["犠打","犠飛"],
"失策":["失策"],
"その他":["打撃妨害","守備妨害","その他"]
};
const positions=["投","捕","一","二","三","遊","左","中","右"];
const INNINGS=15;
const STORAGE_KEY="hamamatsuBaseballLive_v12";
const MIGRATE_KEY="hamamatsuBaseballLive_v11";
const LEGACY_KEYS=["hamamatsuBaseballLive_v7","hamamatsuBaseballLive_v11"];
const defaultState={gameTitle:"OPEN戦①",startTime:"",endTime:"",opponent:"相手校",battingFirst:"top",half:"top",inning:1,batter:0,battingOrder:[0,1,2,3,4,5,6,7,8],members:initialMembers.slice(),retired:Array(initialMembers.length).fill(false),result:"",resultGroup:"",position:"",runs:0,comment:"",records:[],scores:{ham:Array(INNINGS).fill(0),opp:Array(INNINGS).fill(0)},manualScores:{ham:Array(INNINGS).fill(0),opp:Array(INNINGS).fill(0)},bases:[false,false,false]};
let state=loadState(); const $=id=>document.getElementById(id);
for(let i=1;i<=INNINGS;i++)$("inning").insertAdjacentHTML("beforeend",`<option value="${i}">${i}回</option>`);

function clone(o){return JSON.parse(JSON.stringify(o))}
function loadState(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  const legacyRaw=localStorage.getItem(MIGRATE_KEY);
  const s=raw?JSON.parse(raw):(legacyRaw?(()=>{const z=JSON.parse(legacyRaw);return {members:z.members,retired:z.retired,battingOrder:z.battingOrder};})():null);
  if(s){
   const x=clone(defaultState);
   x.gameTitle=s.gameTitle||"OPEN戦①";
   x.startTime=s.startTime||""; x.endTime=s.endTime||"";
   x.opponent=s.opponent||"相手校";
   x.battingFirst=s.battingFirst==="bottom"?"bottom":"top";
   x.half=s.half==="bottom"?"bottom":"top";
   x.inning=Math.min(INNINGS,Math.max(1,Number(s.inning)||1));
   x.members=Array.isArray(s.members)&&s.members.length?s.members.map(n=>String(n).trim()).filter(Boolean):initialMembers.slice();
   x.retired=Array.isArray(s.retired)?x.members.map((_,i)=>!!s.retired[i]):x.members.map(()=>false);
   while(x.retired.length<x.members.length)x.retired.push(false);
   x.battingOrder=Array.isArray(s.battingOrder)&&s.battingOrder.length===9?s.battingOrder.map(n=>Math.max(0,Math.min(x.members.length-1,Number(n)||0))):clone(defaultState.battingOrder);
   x.batter=Math.min(8,Math.max(0,Number(s.batter)||0));
   x.result=s.result||"";x.resultGroup=s.resultGroup||"";x.position=s.position||"";
   x.runs=Math.max(0,Number(s.runs)||0);x.comment=s.comment||"";
   x.records=Array.isArray(s.records)?s.records:[];
   x.manualScores={ham:Array.isArray(s.manualScores?.ham)?s.manualScores.ham.slice(0,INNINGS).map(n=>Math.max(0,Number(n)||0)):Array(INNINGS).fill(0),opp:Array.isArray(s.manualScores?.opp)?s.manualScores.opp.slice(0,INNINGS).map(n=>Math.max(0,Number(n)||0)):Array(INNINGS).fill(0)};
   while(x.manualScores.ham.length<INNINGS)x.manualScores.ham.push(0);while(x.manualScores.opp.length<INNINGS)x.manualScores.opp.push(0);
   x.bases=Array.isArray(s.bases)?s.bases.slice(0,3):[false,false,false];
   return x;
  }
 }catch(e){}
 return clone(defaultState);
}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function offensiveTeam(){return state.half==="top"?(state.battingFirst==="top"?"浜松南":state.opponent):(state.battingFirst==="top"?state.opponent:"浜松南")}
function isHamAttack(){return offensiveTeam()==="浜松南"}
function resetAtBat(){state.result="";state.resultGroup="";state.position="";state.runs=0;state.comment=""}
function total(a){return a.reduce((x,y)=>x+y,0)}
function recalcScores(){state.scores.ham=state.manualScores.ham.slice();state.scores.opp=state.manualScores.opp.slice();state.records.forEach(r=>{let i=r.inning-1;if(i<0||i>=INNINGS)return;if(r.kind==="atbat"||r.kind==="runner"){const team=(r.half==="top")?(state.battingFirst==="top"?"ham":"opp"):(state.battingFirst==="top"?"opp":"ham");state.scores[team][i]+=Number(r.runs)||0;}})}
function renderScore(){
 const ham=state.scores.ham,opp=state.scores.opp,firstHam=state.battingFirst==="top";
 const header="<tr><th></th>"+Array.from({length:INNINGS},(_,i)=>`<th>${i+1}</th>`).join("")+"<th>計</th></tr>";
 const row=(team,a,label)=>`<tr><td>${label}</td>`+a.map((x,i)=>`<td><input class="score-input" inputmode="numeric" min="0" type="number" value="${x||0}" data-score-team="${team}" data-score-inning="${i}" aria-label="${label} ${i+1}回得点"></td>`).join("")+`<td class="total">${total(a)}</td></tr>`;
 const f=firstHam?ham:opp,s=firstHam?opp:ham; const fn=firstHam?"浜松南":state.opponent,sn=firstHam?state.opponent:"浜松南";
 $("scoreTable").innerHTML=header+row(firstHam?"ham":"opp",f,fn)+row(firstHam?"opp":"ham",s,sn);
 document.querySelectorAll("[data-score-team]").forEach(inp=>{inp.onchange=()=>{const team=inp.dataset.scoreTeam,i=+inp.dataset.scoreInning; const val=Math.max(0,Number(inp.value)||0); const auto=state.records.filter(r=>r.inning===i+1).reduce((sum,r)=>sum+((r.kind==="atbat"||r.kind==="runner") && ((r.half==="top"? (state.battingFirst==="top"?"ham":"opp"):(state.battingFirst==="top"?"opp":"ham"))===team) ? (Number(r.runs)||0):0),0); state.manualScores[team][i]=Math.max(0,val-auto); recalcScores(); persist(); renderScore(); renderPreview(); renderCurrent();};});
}
function renderScoreEditor(){}
function renderBattingOrder(){
 const active=state.members.map((n,i)=>({n,i})).filter(x=>!state.retired[x.i]);
 $("battingOrderInputs").innerHTML=state.battingOrder.map((idx,i)=>{
   const selectedInactive=(state.retired[idx]&&state.members[idx])?`<option value="${idx}" selected>${state.members[idx]}（卒業・退部）</option>`:"";
   const options=active.map(x=>`<option value="${x.i}" ${x.i===idx?"selected":""}>${x.n}</option>`).join("");
   return `<div class="batting-item"><div class="batting-no">${i+1}番</div><select data-order="${i}">${selectedInactive}${options}</select></div>`;
 }).join("");
 document.querySelectorAll("#battingOrderInputs select").forEach(s=>s.onchange=e=>{state.battingOrder[+e.target.dataset.order]=+e.target.value;persist();renderLineup()});
}
function renderMembers(){
 const box=$("memberList");
 box.innerHTML=state.members.map((name,i)=>`<div class="entry">
   <div class="row" style="justify-content:space-between">
     <div style="flex:1"><input data-member-name="${i}" value="${name}" aria-label="${name}"></div>
     <button class="small ${state.retired[i]?"":"danger"}" data-toggle-member="${i}">${state.retired[i]?"現役に戻す":"卒業・退部"}</button>
   </div>
 </div>`).join("");
 document.querySelectorAll("[data-member-name]").forEach(inp=>inp.onchange=e=>{
   const i=+e.target.dataset.memberName, name=e.target.value.trim();
   if(!name){e.target.value=state.members[i];return}
   state.members[i]=name;persist();renderMembers();renderBattingOrder();renderLineup();
 });
 document.querySelectorAll("[data-toggle-member]").forEach(b=>b.onclick=()=>{
   const i=+b.dataset.toggleMember;state.retired[i]=!state.retired[i];
   persist();renderMembers();renderBattingOrder();renderLineup();
 });
}
function renderLineup(){
 const ham=isHamAttack();
 $("batterName").textContent=ham?`${state.batter+1}番　${state.members[state.battingOrder[state.batter]]||"打者"}`:"相手攻撃";
 $("resumeBatter").classList.toggle("hidden",!ham);
 if(ham){
   $("resumeBatter").innerHTML=state.battingOrder.map((idx,i)=>`<option value="${i}" ${i===state.batter?"selected":""}>${i+1}番　${state.members[idx]||"未登録"}</option>`).join("");
 }
 $("sideLabel").textContent=`${state.inning}回${state.half==="top"?"表":"裏"}：${offensiveTeam()}`;
}
function renderResults(){
 const allResults=Object.values(resultGroups).flat();
 $("resultDetails").innerHTML=allResults.map(r=>`<button class="${state.result===r?"selected":""}" data-r="${r}">${r}</button>`).join("");
 document.querySelectorAll("#resultDetails button").forEach(b=>b.onclick=()=>{state.result=b.dataset.r;renderResults();persist()});
 $("resultNotice").textContent=state.result?`選択中：${state.result}`:"打席結果を選択して、「この打席を記録」を押してください。得点が0点でも記録できます。";
 $("positions").innerHTML=positions.map(p=>`<button class="${state.position===p?"selected":""}" data-p="${p}">${p}</button>`).join("");
 document.querySelectorAll("#positions button").forEach(b=>b.onclick=()=>{state.position=b.dataset.p;renderResults();persist()});
 $("runCount").textContent=state.runs
}
function renderBases(){}
function renderCurrent(){
 const top=state.records.filter(r=>r.inning===state.inning&&r.half==="top");
 const bottom=state.records.filter(r=>r.inning===state.inning&&r.half==="bottom");
 const draw=r=>r.map(x=>`<div class="entry">${x.text}</div>`).join("");
 let html=`<div class="entry" style="font-weight:900">【${state.inning}回表】</div>`;
 html+=top.length?draw(top):`<div class="entry" style="color:#98a2b3">まだ記録はありません。</div>`;
 html+=`<div class="entry" style="font-weight:900;margin-top:6px">【${state.inning}回裏】</div>`;
 html+=bottom.length?draw(bottom):`<div class="entry" style="color:#98a2b3">まだ記録はありません。</div>`;
 $("currentInning").innerHTML=html;
}
function renderPreview(){
 const opp=state.opponent||"相手校";
 const top=state.records.filter(r=>r.inning===state.inning&&r.half==="top");
 const bottom=state.records.filter(r=>r.inning===state.inning&&r.half==="bottom");
 let lines=[];
 const title=state.gameTitle||"試合速報";
 lines.push(title);
 lines.push(`浜松南－${opp}`);
 if(state.endTime) lines.push(`試合終了　${state.endTime}`);
 else if(state.startTime) lines.push(`試合開始　${state.startTime}`);
 else lines.push("試合中");
 lines.push("");
 // LINE実物に合わせ、スコアボードはイニング番号を付けず、先攻チームを上段に表示。
 const firstHam=state.battingFirst==="top";
 const firstLabel=firstHam?"浜南":opp;
 const secondLabel=firstHam?opp:"浜南";
 const first=firstHam?state.scores.ham:state.scores.opp;
 const second=firstHam?state.scores.opp:state.scores.ham;
 let lastInning=Math.max(1,state.inning);
 for(let i=INNINGS-1;i>=0;i--){if((state.scores.ham[i]||state.scores.opp[i])!==0 || state.records.some(r=>r.inning===i+1)){lastInning=Math.max(lastInning,i+1);break}}
 const scoreLine=a=>a.slice(0,lastInning).map(n=>String(n)).join("");
 lines.push(firstLabel.padEnd(4," ")+" "+scoreLine(first)+" "+total(first));
 lines.push(secondLabel.padEnd(4," ")+" "+scoreLine(second)+" "+total(second));
 lines.push("");
 lines.push(`【${state.inning}回表】`);
 if(top.length)top.forEach(r=>lines.push(r.text));else lines.push("（記録なし）");
 lines.push("");
 lines.push(`【${state.inning}回裏】`);
 if(bottom.length)bottom.forEach(r=>lines.push(r.text));else lines.push("（記録なし）");
 $("preview").textContent=lines.join("\n")
}
function renderAll(){renderScore();renderBattingOrder();renderMembers();renderLineup();renderResults();renderBases();renderCurrent();renderPreview();$("gameTitle").value=state.gameTitle;$("opponent").value=state.opponent;$("battingFirst").value=state.battingFirst;$("startTime").value=state.startTime;$("endTime").value=state.endTime;$("inning").value=state.inning;renderGameHeader()}
function renderGameHeader(){const title=state.gameTitle||"試合速報";const opp=state.opponent||"相手校";let t=state.endTime?`試合終了　${state.endTime}`:(state.startTime?`試合開始　${state.startTime}`:"試合中");$("lineGameHeader").innerHTML=`<div class="game-title">${title}</div><div class="game-match">浜松南－${opp}</div><div class="game-time">${t}</div>`}

$("saveAtBat").onclick=()=>{
 if(!state.result){alert("打席結果を選択してください。");return}
 let text=isHamAttack()?`${state.members[state.battingOrder[state.batter]]||"打者"}　`:"";
 text+=state.result;
 if(state.position&&/ゴロ|フライ|ライナー|安打|失策|犠/.test(state.result))text+=`（${state.position}）`;
 if(state.runs>0)text+=`　${state.runs}点`;
 if(state.comment.trim())text+=`　${state.comment.trim()}`;
 state.records.push({kind:"atbat",inning:state.inning,half:state.half,text,runs:state.runs,batterIndex:isHamAttack()?state.batter:null});
 recalcScores();
 if(isHamAttack())state.batter=(state.batter+1)%9;
 resetAtBat();
 persist();
 renderAll();
}
$("plusRun").onclick=()=>{state.runs++;renderResults();persist()};$("minusRun").onclick=()=>{state.runs=Math.max(0,state.runs-1);renderResults();persist()};
$("resumeBatter").onchange=e=>{if(isHamAttack()){state.batter=+e.target.value;resetAtBat();persist();renderAll()}}
$("battingFirst").onchange=e=>{state.battingFirst=e.target.value; if(state.records.length===0){state.half="top";state.inning=1;state.batter=0;} resetAtBat();persist();renderAll()};$("inning").onchange=e=>{state.inning=+e.target.value;resetAtBat();persist();renderAll()};$("opponent").oninput=e=>{state.opponent=e.target.value||"相手校";persist();renderScore();renderLineup();renderPreview();renderGameHeader()};
$("gameTitle").oninput=e=>{state.gameTitle=e.target.value||"OPEN戦①";persist();renderPreview();renderGameHeader()};
$("startTime").oninput=e=>{state.startTime=e.target.value;persist();renderPreview();renderGameHeader()};
$("endTime").oninput=e=>{state.endTime=e.target.value;persist();renderPreview();renderGameHeader()};
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
$("setStartNow").onclick=()=>{state.startTime=nowHM();state.endTime="";persist();renderAll()};
$("setEndNow").onclick=()=>{state.endTime=nowHM();persist();renderAll()};
$("runnerCommentText").oninput=e=>{state.comment=e.target.value;persist()};
let runnerEvent="";
$("stealEvent").onclick=()=>runnerEvent="盗塁";$("pickoffEvent").onclick=()=>runnerEvent="牽制アウト";$("wildEvent").onclick=()=>runnerEvent="暴投・捕逸";$("advanceEvent").onclick=()=>runnerEvent="進塁";$("scoreEvent").onclick=()=>runnerEvent="走者生還（得点）";$("runnerComment").onclick=()=>runnerEvent="自由入力";
$("saveRunnerEvent").onclick=()=>{let text=runnerEvent;if(!text&&$("runnerCommentText").value.trim())text="走者プレー";if($("runnerCommentText").value.trim())text+=(text?"：":"")+$("runnerCommentText").value.trim();if(!text){alert("走者プレーを選択または入力してください。");return}let runs=text.includes("生還")?1:0;state.records.push({kind:"runner",inning:state.inning,half:state.half,text:`【走者】${text}`,runs});recalcScores();runnerEvent="";$("runnerCommentText").value="";persist();renderAll();};
$("undoPlay").onclick=()=>{const idx=state.records.map((r,i)=>({r,i})).reverse().find(x=>x.r.inning===state.inning&&x.r.half===state.half);if(!idx){alert("この攻撃に戻せるプレーはありません。");return}if(!confirm(`「${idx.r.text}」を1プレー戻します。よろしいですか？`))return;state.records.splice(idx.i,1);recalcScores();resetAtBat();persist();renderAll();};
$("nextHalf").onclick=()=>{if(state.half==="top")state.half="bottom";else{state.half="top";state.inning=Math.min(INNINGS,state.inning+1)}resetAtBat();persist();renderAll();window.scrollTo({top:0,behavior:"smooth"})};
$("clearCurrent").onclick=()=>{if(!confirm("現在の攻撃の速報をすべて削除しますか？スコアもこの攻撃分だけ戻します。"))return;state.records=state.records.filter(r=>!(r.inning===state.inning&&r.half===state.half));recalcScores();state.bases=[false,false,false];resetAtBat();persist();renderAll()};
function startNewGame(){
 const keepOrder=Array.isArray(state.battingOrder)&&state.battingOrder.length===9?state.battingOrder.slice():clone(defaultState.battingOrder);
 const keepMembers=Array.isArray(state.members)&&state.members.length?state.members.slice():initialMembers.slice();
 const keepRetired=Array.isArray(state.retired)?state.retired.slice():keepMembers.map(()=>false);
 LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));
 localStorage.removeItem(STORAGE_KEY);
 state=clone(defaultState);
 state.startTime=nowHM();
 state.members=keepMembers;
 state.retired=keepMembers.map((_,i)=>!!keepRetired[i]);
 state.battingOrder=keepOrder.map(n=>Math.max(0,Math.min(state.members.length-1,Number(n)||0)));
 persist();renderAll();window.scrollTo({top:0,behavior:"smooth"});
}
$("clearGame").onclick=()=>{if(!confirm("速報データ・スコアをすべて消去しますか？登録メンバーと打順は残ります。"))return;startNewGame();alert("速報データを消去しました。")};
$("newGame").onclick=()=>{if(!confirm("新しい試合を開始します。前の試合のスコアと速報は消えます。登録メンバーと打順は残ります。"))return;startNewGame()};

$("addMember").onclick=()=>{
 const input=$("memberNameInput"),name=input.value.trim();
 if(!name){alert("選手名を入力してください。");input.focus();return}
 if(state.members.includes(name)){alert("同じ名前の選手がすでに登録されています。");return}
 state.members.push(name);state.retired.push(false);input.value="";
 persist();renderMembers();renderBattingOrder();renderLineup();input.focus();
};
$("memberNameInput").onkeydown=e=>{if(e.key==="Enter")$("addMember").click()};
$("saveBattingOrder").onclick=()=>{persist();alert("打順を登録しました。")};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("preview").textContent);alert("速報をコピーしました。LINEに貼り付けできます。")}catch(e){alert("コピーできませんでした。速報欄を長押ししてコピーしてください。")}};

$("toggleMembers").onclick=()=>{const box=$("memberManagement");box.classList.toggle("hidden");$("toggleMembers").textContent=box.classList.contains("hidden")?"メンバー表を表示":"メンバー表を閉じる"};
renderAll();
</script>
</body>
</html>
