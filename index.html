<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>浜松南 野球速報</title>
<style>
:root{--b:#124c87;--l:#e9eef4;--g:#16844a}
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#111}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;padding:14px}
h1{font-size:20px;margin:0}.w{color:#dbeafe}
.m{max-width:600px;margin:auto;padding:10px 10px 100px}
.c{background:#fff;border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px #0001}
.r{display:flex;gap:8px;align-items:center}.b{justify-content:space-between}
.s{font-size:12px;color:#697586}.p{font-size:20px;font-weight:800}.in{font-size:20px;font-weight:800}.sc{font-size:34px;font-weight:900}
button{border:0;border-radius:11px;background:var(--l);color:#153e66;font-size:16px;font-weight:700;min-height:48px;padding:9px}
button.primary{background:var(--b);color:#fff}button.green{background:var(--g);color:#fff}
button:disabled{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.tab{display:flex;gap:7px}.tab button{flex:1}
.sel{outline:3px solid #1c70b7}.hide{display:none}.log{padding:9px 3px;border-bottom:1px solid #edf0f3}
input,textarea{font:inherit;width:100%;border:1px solid #d9e0e8;border-radius:10px;padding:11px}
textarea{min-height:180px}.st{display:grid;grid-template-columns:35px 1fr;gap:6px;align-items:center;margin:6px 0}
.note{background:#fff8df;border-radius:10px;padding:9px;font-size:13px}
.ocrbox{background:#eef6ff;border-radius:12px;padding:10px;margin-top:9px}
#ocrStatus{margin-top:7px;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:22px;display:none;z-index:20}
</style>
</head>
<body>
<header><h1>⚾ 浜松南 野球速報</h1><div class="w">スタメン・入力内容はこのiPhoneに自動保存</div></header>

<main class="m">
<section class="c">
<div class="r b">
<div><div class="s">試合設定</div><div class="p">先攻・後攻 / スタメン</div></div>
<button id="set" class="primary">設定・編集</button>
</div>
<div id="sum" style="margin-top:8px"></div>

<div id="setup" class="hide" style="margin-top:10px">
<div class="s">浜松南の攻撃順</div>
<div class="grid2" style="margin:7px 0"><button id="first">先攻</button><button id="second">後攻</button></div>

<div class="ocrbox">
<b>📷 メンバー表写真から読み取る</b>
<div class="s" style="margin:5px 0">
LINEなどで受け取ったメンバー表写真を選択してください。読み取った名前を確認・修正してから保存できます。
</div>
<input id="memberPhoto" type="file" accept="image/*" style="display:none">
<button id="ocrBtn" class="primary" style="width:100%;margin-top:6px">写真を選択して読み取る</button>
<div id="ocrStatus" class="s"></div>
</div>

<div id="edit" style="margin-top:9px"></div>
<button id="save" class="green" style="width:100%;margin-top:7px">スタメンを保存して試合開始</button>
</div>
</section>

<section class="c">
<div class="r b">
<div><div class="s">現在の攻撃</div><div class="in" id="inn">1回表</div></div>
<div style="text-align:right"><div class="s">浜松南</div><div class="sc" id="score">0</div></div>
</div>
<div class="tab" style="margin-top:10px">
<button id="prev">‹ 前</button><button id="now" class="primary">1回表</button><button id="next">次 ›</button>
</div>
</section>

<section class="c">
<div class="r b">
<div><div class="s">現在の打者</div><div class="p" id="bat">1番　選手名未登録</div></div>
<div class="s" id="slot">打順 1番</div>
</div>
<div style="height:9px"></div><div class="grid" id="results"></div>
</section>

<section class="c hide" id="pos">
<div class="p">相手の守備位置</div><div class="s">必要なプレーだけ選択してください</div>
<div class="grid" id="positions" style="margin-top:8px"></div>
<button id="nop" style="width:100%;margin-top:8px">守備位置なしで確定</button>
</section>

<section class="c">
<div class="grid2"><button id="confirm" class="primary">この打席を確定</button><button id="nextbat">次の打者</button></div>
<div style="height:7px"></div>
<div class="grid2"><button id="sub">選手交代</button><button id="undo">↩ 1つ戻す</button></div>
</section>

<section class="c">
<div class="r b"><div class="p">このイニング</div><button id="clear">イニング取消</button></div>
<div id="logs"></div>
</section>

<section class="c">
<div class="r b"><div class="p">速報</div><button id="make" class="green">速報を作成</button></div>
<div id="post" class="hide" style="margin-top:9px">
<textarea id="text"></textarea>
<div class="grid2" style="margin-top:8px"><button id="copy">コピー</button><button id="share" class="green">共有</button></div>
</div>
</section>

<section class="c hide" id="subcard">
<div class="p">選手交代</div><div class="s">交代前 → 交代後</div>
<div class="grid2"><input id="out" placeholder="交代する選手"><input id="into" placeholder="入る選手"></div>
<button id="savesub" class="green" style="width:100%;margin-top:8px">交代を記録</button>
</section>
</main>

<div class="toast" id="toast"></div>

<script>
const K='hamamatsu_live_v9';
const R=['ヒット','2塁打','3塁打','本塁打','四球','死球','犠打','犠飛','三振','ゴロ','フライ','エラー','その他'];
const P=['投手','捕手','一塁','二塁','三塁','遊撃','左翼','中堅','右翼'];
const DEFAULT_STATE={inning:1,half:'表',score:0,batter:0,members:Array(9).fill('選手名未登録'),battingFirst:true,plays:[],pending:null};
let st;
try{const raw=localStorage.getItem(K);st=raw?JSON.parse(raw):null}catch(e){st=null}
if(!st||typeof st!=='object')st=JSON.parse(JSON.stringify(DEFAULT_STATE));
if(!Array.isArray(st.members)||st.members.length!==9)st.members=Array(9).fill('選手名未登録');
if(!Array.isArray(st.plays))st.plays=[];
st.pending=null;

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(K,JSON.stringify(st));

function toast(t){
  $('toast').textContent=t;$('toast').style.display='block';
  clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1600)
}
function esc(x){
  return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}
function setup(){
  $('first').className=st.battingFirst?'primary':'';
  $('second').className=!st.battingFirst?'primary':'';
  $('edit').innerHTML=st.members.map((n,i)=>
    '<div class="st"><b>'+(i+1)+'番</b><input data-i="'+i+'" value="'+esc(n)+'" placeholder="'+(i+1)+'番 選手名"></div>'
  ).join('');
  $('sum').innerHTML='<b>'+(st.battingFirst?'先攻':'後攻')+'</b>　スタメン '+st.members.filter(x=>x&&x!=='選手名未登録').length+'/9人登録済み';
}
function render(){
  $('inn').textContent=st.inning+'回'+st.half;
  $('now').textContent=st.inning+'回'+st.half;
  $('score').textContent=st.score;
  $('bat').textContent=(st.batter+1)+'番　'+(st.members[st.batter]||'選手名未登録');
  $('slot').textContent='打順 '+(st.batter+1)+'番';
  let a=st.plays.filter(p=>p.inning===st.inning&&p.half===st.half);
  $('logs').innerHTML=a.length?a.map(p=>
    '<div class="log">'+(p.type==='交代'
      ?'選手交代：'+esc(p.out)+' → '+esc(p.in)
      :esc(p.name)+'：<b>'+esc(p.result)+'</b>'+(p.pos?'（'+esc(p.pos)+'）':''))+'</div>'
  ).join(''):'<div class="s">まだ入力されていません</div>';
  setup();save();
}
function finish(){
  if(!st.pending)return;
  let n=st.members[st.batter]||'選手名未登録';
  st.plays.push({type:'打席',inning:st.inning,half:st.half,name:n,result:st.pending.result,pos:st.pending.pos});
  if(st.pending.result==='本塁打')st.score++;
  st.pending=null;$('pos').classList.add('hide');
  document.querySelectorAll('.result').forEach(x=>x.classList.remove('sel'));
  st.batter=(st.batter+1)%9;render();toast('記録して次の打者へ')
}

$('results').innerHTML=R.map(x=>'<button class="result">'+x+'</button>').join('');
document.querySelectorAll('.result').forEach(b=>b.onclick=()=>{
  let r=b.textContent;st.pending={result:r,pos:''};
  document.querySelectorAll('.result').forEach(x=>x.classList.toggle('sel',x.textContent===r));
  if(['ヒット','2塁打','3塁打','本塁打','犠打','犠飛','ゴロ','フライ'].includes(r)){
    $('pos').classList.remove('hide');toast('守備位置を選択してください')
  }else finish()
});
$('positions').innerHTML=P.map(x=>'<button>'+x+'</button>').join('');
document.querySelectorAll('#positions button').forEach(b=>b.onclick=()=>{
  if(st.pending){st.pending.pos=b.textContent;finish()}
});
$('nop').onclick=finish;
$('confirm').onclick=()=>st.pending?finish():toast('結果を選択してください');
$('nextbat').onclick=()=>{st.batter=(st.batter+1)%9;render()};

function half(d){
  if(d>0){
    if(st.half==='表')st.half='裏';
    else{st.half='表';st.inning++}
  }else{
    if(st.half==='裏')st.half='表';
    else if(st.inning>1){st.inning--;st.half='裏'}
  }
  st.batter=0;st.pending=null;$('pos').classList.add('hide');render()
}
$('next').onclick=()=>half(1);$('prev').onclick=()=>half(-1);
$('undo').onclick=()=>{
  if(!st.plays.length)return toast('戻せる入力がありません');
  let p=st.plays.pop();if(p.result==='本塁打')st.score--;
  if(p.type==='打席')st.batter=(st.batter+8)%9;render()
};
$('clear').onclick=()=>{
  st.plays=st.plays.filter(p=>!(p.inning===st.inning&&p.half===st.half));st.batter=0;render()
};
$('sub').onclick=()=>$('subcard').classList.toggle('hide');
$('savesub').onclick=()=>{
  let o=$('out').value.trim(),i=$('into').value.trim();
  if(!o||!i)return toast('交代前・交代後を入力してください');
  let idx=st.members.indexOf(o);if(idx>=0)st.members[idx]=i;
  st.plays.push({type:'交代',inning:st.inning,half:st.half,out:o,in:i});
  $('out').value='';$('into').value='';render();toast('選手交代を記録しました')
};
$('make').onclick=()=>{
  let a=st.plays.filter(p=>p.inning===st.inning&&p.half===st.half);
  let lines=a.map(p=>p.type==='交代'?'選手交代：'+p.out+' → '+p.in:p.name+'：'+p.result+(p.pos?'（'+p.pos+'）':''));
  $('text').value='【'+st.inning+'回'+st.half+'】\n'+lines.join('\n')+'\n\n浜松南 '+st.score;
  $('post').classList.remove('hide')
};
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText($('text').value)}
  catch(e){$('text').select();document.execCommand('copy')}
  toast('速報をコピーしました')
};
$('share').onclick=async()=>{
  if(navigator.share)try{await navigator.share({text:$('text').value})}catch(e){}
  else $('copy').click()
};

/* メンバー表OCR */
$('ocrBtn').onclick=()=>$('memberPhoto').click();
$('memberPhoto').onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(f)doOCR(f);e.target.value=''
};

async function makeSmallJpeg(file){
  return await new Promise((resolve,reject)=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=()=>{
      img.onload=()=>{
        const max=1800;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.82))
      };
      img.onerror=reject;img.src=reader.result
    };
    reader.onerror=reject;reader.readAsDataURL(file)
  })
}
function pickNames(text){
  let lines=text.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  let out=[];
  for(let line of lines){
    line=line.replace(/^\s*[0-9０-９]{1,2}\s*[.．、)）:：\-ー]?\s*/,'').trim();
    line=line.replace(/^(投手|捕手|一塁手|二塁手|三塁手|遊撃手|左翼手|中堅手|右翼手)\s*/,'').trim();
    line=line.replace(/[|｜]/g,'').trim();
    if(line.length>=2&&line.length<=12&&!/[年月日|高校|学校|球場|守備位置|登録|氏名|チーム|大会|試合]/.test(line)){
      if(!out.includes(line))out.push(line)
    }
  }
  return out.slice(0,9)
}
async function doOCR(file){
  $('ocrStatus').textContent='写真を読み取っています…';
  $('ocrBtn').disabled=true;
  try{
    const data=await makeSmallJpeg(file);
    const fd=new FormData();
    fd.append('base64Image',data);
    fd.append('language','jpn');
    fd.append('isOverlayRequired','false');
    fd.append('OCREngine','3');
    const res=await fetch('https://api.ocr.space/parse/image',{
      method:'POST',headers:{apikey:'helloworld'},body:fd
    });
    const j=await res.json();
    if(j.IsErroredOnProcessing)throw new Error(j.ErrorMessage||'OCRエラー');
    const text=(j.ParsedResults||[]).map(x=>x.ParsedText||'').join('\n').trim();
    if(!text)throw new Error('文字を読み取れませんでした');
    const names=pickNames(text);
    if(names.length){
      names.forEach((n,i)=>st.members[i]=n);
      setup();save();
      $('ocrStatus').textContent=names.length+'人を読み取りました。下の名前を確認・修正してください。';
      toast(names.length+'人を仮登録しました')
    }else{
      $('ocrStatus').textContent='文字は読み取りましたが、選手名を自動判定できませんでした。下の欄へ手入力してください。';
    }
  }catch(e){
    console.error(e);
    $('ocrStatus').textContent='読み取りに失敗しました。写真を明るく・正面から撮り直すか、下の欄へ手入力してください。';
    toast('読み取りに失敗しました')
  }finally{$('ocrBtn').disabled=false}
}

$('set').onclick=()=>{$('setup').classList.toggle('hide');setup()};
$('first').onclick=()=>{st.battingFirst=true;setup()};
$('second').onclick=()=>{st.battingFirst=false;setup()};
$('save').onclick=()=>{
  document.querySelectorAll('#edit input').forEach(x=>st.members[+x.dataset.i]=x.value.trim()||'選手名未登録');
  st.batter=0;save();$('setup').classList.add('hide');render();toast('スタメンを保存しました')
};
render();
window.addEventListener('error',e=>{console.error(e);try{toast('アプリを再読み込みしてください')}catch(_){}});
</script>
</body>
</html>
