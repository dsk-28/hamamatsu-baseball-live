<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浜松南 野球速報</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#111}
header{background:#2d5b93;color:white;padding:18px}h1{margin:0;font-size:25px}.sub{margin-top:4px}
main{max-width:720px;margin:auto;padding:12px}.card{background:white;border-radius:18px;padding:16px;margin:10px 0}
button{border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:bold}
.primary{background:#2d5b93;color:white;width:100%}.secondary{background:#e8eef6;color:#173b65}
input[type=file]{display:none}.status{background:#edf5ff;padding:12px;border-radius:12px;margin-top:10px}
.hint{background:#fff8df;border-radius:14px;padding:13px;margin-top:10px}
.row{display:grid;grid-template-columns:48px 1fr 42px 42px;gap:7px;align-items:center;background:#f7f9fc;border-radius:14px;padding:8px;margin:8px 0}
.num{text-align:center;font-weight:bold}.name{width:100%;padding:12px;border:2px solid #d9e0e8;border-radius:12px;font-size:18px}
.arrow{padding:10px 0;background:#e9eff6;color:#244a75}.flex{display:flex;gap:8px}.flex>*{flex:1}
.progress{height:8px;background:#e4e9f0;border-radius:9px;overflow:hidden;margin-top:9px}.bar{height:100%;width:0;background:#2d5b93}
.preview{width:100%;max-height:360px;object-fit:contain;margin-top:10px;border-radius:12px}
.small{font-size:13px;color:#667085}pre{white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto}
</style>
</head>
<body>
<header><h1>⚾ 浜松南 野球速報</h1><div class="sub">スタメン・入力内容はこのiPhoneに自動保存</div></header>
<main>
<section class="card">
<label for="photo"><button class="primary" type="button" onclick="document.getElementById('photo').click()">📷 写真を選択して読み取る</button></label>
<input id="photo" type="file" accept="image/*">
<div id="status" class="status">写真を選択してください。</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<img id="preview" class="preview" hidden>
<div class="hint"><b>読み取り後の修正</b><br>名前は直接修正できます。順番がずれた場合は、▲▼で入れ替えできます。</div>
</section>
<section class="card">
<div class="flex"><button class="secondary" onclick="clearNames()">全員クリア</button><button class="secondary" onclick="loadSaved()">保存データを復元</button></div>
<div id="rows"></div>
<button class="primary" onclick="saveNames()" style="margin-top:8px">💾 スタメンを保存</button>
</section>
<section class="card"><div class="small">OCR確認用</div><pre id="log"></pre></section>
</main>
<script>
const KEY="hamamatsu_lineup_v4";
let names=Array(9).fill("");
const rows=document.getElementById("rows");
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function render(){
 rows.innerHTML="";
 names.forEach((n,i)=>{
  const d=document.createElement("div");d.className="row";
  d.innerHTML='<div class="num">'+(i+1)+'番</div><input class="name" value="'+esc(n)+'" placeholder="選手名未登録" oninput="names['+i+']=this.value;saveSilent()"><button class="arrow" onclick="move('+i+',-1)">▲</button><button class="arrow" onclick="move('+i+',1)">▼</button>';
  rows.appendChild(d);
 });
}
function move(i,d){let j=i+d;if(j<0||j>8)return;[names[i],names[j]]=[names[j],names[i]];render();saveSilent()}
function saveSilent(){localStorage.setItem(KEY,JSON.stringify(names))}
function saveNames(){saveSilent();document.getElementById("status").textContent="スタメンを保存しました。"}
function loadSaved(){try{let x=JSON.parse(localStorage.getItem(KEY)||"[]");if(x.length===9){names=x;render();document.getElementById("status").textContent="保存データを復元しました。"}}catch(e){}}
function clearNames(){names=Array(9).fill("");render();saveSilent()}
function progress(x){document.getElementById("bar").style.width=x+"%"}
async function crop(file){
 const img=new Image(),url=URL.createObjectURL(file);
 await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
 document.getElementById("preview").src=url;document.getElementById("preview").hidden=false;
 const c=document.createElement("canvas"),w=img.naturalWidth,h=img.naturalHeight;
 c.width=Math.floor(w*.55*2.5);c.height=Math.floor(h*.82*2.5);
 const x=c.getContext("2d");x.imageSmoothingEnabled=false;
 x.drawImage(img,w*.45,h*.08,w*.55,h*.82,0,0,c.width,c.height);
 const p=x.getImageData(0,0,c.width,c.height);
 for(let i=0;i<p.data.length;i+=4){let g=.299*p.data[i]+.587*p.data[i+1]+.114*p.data[i+2];let v=g<185?0:255;p.data[i]=p.data[i+1]=p.data[i+2]=v}
 x.putImageData(p,0,0);return c.toDataURL("image/png");
}
function clean(s){return s.replace(/[ \t\r\n|]/g,"").replaceAll("齋藤","斎藤").replaceAll("齊藤","斎藤").replaceAll("斉藤","斎藤")}
function candidates(text){
 let a=[];
 for(let line of text.split(/\n+/)){
  line=clean(line).replace(/[0-9０-９一二三四五六七八九十DH\-_=:：]/g,"").replace(/[^ぁ-んァ-ヶ一-龯々]/g,"");
  if(line.length>=3&&line.length<=6&&!a.includes(line))a.push(line);
 }
 return a.slice(0,9);
}
document.getElementById("photo").addEventListener("change",async e=>{
 let f=e.target.files&&e.target.files[0];if(!f)return;
 try{
  progress(5);document.getElementById("status").textContent="写真を解析しています…";
  let data=await crop(f);progress(20);
  document.getElementById("status").textContent="日本語OCRを準備しています…";
  let r=await Tesseract.recognize(data,"jpn",{logger:m=>{if(m.status==="recognizing text")progress(20+Math.round((m.progress||0)*75))}});
  document.getElementById("log").textContent=r.data.text;
  let got=candidates(r.data.text);names=Array(9).fill("");got.forEach((v,i)=>names[i]=v);
  render();saveSilent();progress(100);
  document.getElementById("status").textContent=got.length+"/9人を読み取りました。空欄や誤りは下で修正できます。";
 }catch(err){
  progress(0);document.getElementById("status").textContent="読み取りに失敗しました。もう一度写真を選択してください。";document.getElementById("log").textContent=String(err);
 }
});
render();loadSaved();
</script>
</body>
</html>
